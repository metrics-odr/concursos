name: Publicar Área do Concurseiro

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar scripts e dados
        run: |
          python3 scripts/edital_topicos.py
          python3 scripts/gerar_acervo.py
          python3 flashcards/scripts/exportar_anki.py
          python3 scripts/validar_nivelamento.py
          git diff --stat --exit-code -- concursos/cgu-affc/edital/topicos.json concursos/cgu-affc/acervo \
            || echo "::warning::Acervo/tópicos regenerados diferem do commit — rode os scripts localmente."
          node --check app/app.js

      - name: Montar o site
        run: |
          mkdir _site
          git ls-files | grep -v '^\.github/' | while read -r f; do mkdir -p "_site/$(dirname "$f")"; cp "$f" "_site/$f"; done
          python3 scripts/gerar_indice.py _site
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
